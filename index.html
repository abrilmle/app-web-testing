<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Repurposer</title>
    <style>
        /* Diseño base con CSS Puro para evitar dependencias externas en celulares */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-h: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        header {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            items-center: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #06b6d4, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .version-badge {
            font-size: 12px;
            color: #94a3b8;
            background-color: #1e293b;
            padding: 4px 10px;
            border-radius: 9999px;
            border: 1px solid #334155;
        }
        main {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            resize: none;
        }
        textarea:focus {
            border-color: #06b6d4;
        }
        .btn-primary {
            display: block;
            width: 100%;
            background: linear-gradient(to right, #06b6d4, #d946ef);
            color: white;
            font-weight: 600;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(6, 182, 212, 0.2);
        }
        .btn-primary:active {
            transform: scale(0.99);
        }
        #loader {
            display: none;
            text-align: center;
            padding: 20px 0;
            color: #94a3b8;
            font-size: 14px;
        }
        #resultsSection {
            display: none;
            margin-top: 10px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 16px;
        }
        .result-card {
            background-color: rgba(30, 41, 59, 0.4);
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .badge-linkedin { color: #22d3ee; background-color: rgba(6, 182, 212, 0.1); }
        .badge-twitter { color: #e879f9; background-color: rgba(217, 70, 239, 0.1); }
        .post-text {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-line;
        }
        .btn-secondary {
            display: block;
            width: 100%;
            background-color: #020617;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding-top: 20px;
            font-size: 12px;
            color: #475569;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <header>
        <h1>🚀 MultiPost AI</h1>
        <span class="version-badge">Prototipo v1.2</span>
    </header>

    <!-- Contenido Principal -->
    <main>
        <!-- Panel de Entrada -->
        <div class="card">
            <label>Pega tu texto largo, artículo o idea base:</label>
            <textarea id="inputText" placeholder="Escribe o pega aquí tu contenido..."></textarea>
            <button onclick="transformarContenido()" class="btn-primary">Transformar Contenido con IA</button>
        </div>

        <!-- Pantalla de Carga -->
        <div id="loader">⏳ Procesando y adaptando formatos...</div>

        <!-- Sección de Resultados -->
        <div id="resultsSection">
            <h3 class="section-title">✨ Contenido Optimizado</h3>
            
            <!-- Tarjeta LinkedIn -->
            <div class="result-card">
                <span class="badge badge-linkedin">LinkedIn</span>
                <p id="linkedinPost" class="post-text"></p>
                <button onclick="copiarTexto('linkedinPost')" class="btn-secondary">📋 Copiar Post</button>
            </div>

            <!-- Tarjeta X -->
            <div class="result-card">
                <span class="badge badge-twitter">X / Twitter</span>
                <p id="twitterPost" class="post-text"></p>
                <button onclick="copiarTexto('twitterPost')" class="btn-secondary">📋 Copiar Post</button>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer>
        MultiPost AI App &copy; Todos los derechos reservados.
    </footer>

    <!-- Lógica de Funcionamiento -->
    <script>
        function transformarContenido() {
            const textoOriginal = document.getElementById('inputText').value.trim();
            
            if (!textoOriginal) {
                alert("Por favor, ingresa algún texto primero.");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';

            setTimeout(() => {
                const resumenBreve = textoOriginal.split('.').slice(0, 2).join('.') + '.';
                
                const postLinkedIn = `💼 REPURPOSING TIP DE HOY\n\n¿Te cuesta crear contenido constante? No necesitas escribir desde cero todo el tiempo. La clave está en reciclar de forma inteligente.\n\n🎯 Idea principal:\n"${resumenBreve}"\n\n¿Qué opinas de esta estrategia? Te leo en los comentarios 👇\n\n#Productividad #MarketingDigital #CreadoresDeContenido`;
                
                const postTwitter = `🧵 Crear contenido no tiene por qué tomarte todo el día.\n\nAcá te dejo una idea clave para aplicar hoy mismo:\n\n"${resumenBreve.substring(0, 140)}..."\n\n¿Estás de acuerdo? Dejá tu RT o Like 🚀`;

                document.getElementById('linkedinPost').innerText = postLinkedIn;
                document.getElementById('twitterPost').innerText = postTwitter;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'block';
            }, 1200); 
        }

        function copiarTexto(idElemento) {
            const texto = document.getElementById(idElemento).innerText;
            navigator.clipboard.writeText(texto).then(() => {
                alert("¡Texto copiado al portapapeles con éxito! 🎉");
            });
        }
    </script>
</body>
</html>
