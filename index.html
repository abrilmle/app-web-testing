<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Repurposer</title>
    <style>
        /* Diseño base nativo para celulares */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        header {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #06b6d4, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .version-badge {
            font-size: 12px;
            color: #94a3b8;
            background-color: #1e293b;
            padding: 4px 10px;
            border-radius: 9999px;
            border: 1px solid #334155;
        }
        main {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .card-config {
            background-color: #111827;
            border: 1px solid #e11d48;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
        }
        input:focus, textarea:focus {
            border-color: #06b6d4;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            resize: none;
        }
        .btn-primary {
            display: block;
            width: 100%;
            background: linear-gradient(to right, #06b6d4, #d946ef);
            color: white;
            font-weight: 600;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(6, 182, 212, 0.2);
            text-align: center;
        }
        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
        #loader {
            display: none;
            text-align: center;
            padding: 20px 0;
            color: #94a3b8;
            font-size: 14px;
        }
        #resultsSection {
            display: none;
            margin-top: 10px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 16px;
        }
        .result-card {
            background-color: rgba(30, 41, 59, 0.4);
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .badge-linkedin { color: #22d3ee; background-color: rgba(6, 182, 212, 0.1); }
        .badge-twitter { color: #e879f9; background-color: rgba(217, 70, 239, 0.1); }
        .post-text {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-line;
        }
        .btn-secondary {
            display: block;
            width: 100%;
            background-color: #020617;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
            text-align: center;
        }
        .link-api {
            color: #38bdf8;
            text-decoration: underline;
            font-size: 12px;
        }
        footer {
            text-align: center;
            padding-top: 20px;
            font-size: 12px;
            color: #475569;
            border-top: 1px solid #1e293b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚀 MultiPost AI</h1>
        <span class="version-badge">Prototipo v2.1 (IA Fixed)</span>
    </header>

    <main>
        <div class="card-config">
            <label for="apiKey">🔑 Configuración de Google Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="Pega tu clave AIzaSy... aquí" oninput="guardarKey()">
            <a href="https://aistudio.google.com/" target="_blank" class="link-api">¿No tienes una clave? Consíguela gratis aquí</a>
        </div>

        <div class="card">
            <label>Pega tu texto largo, artículo o idea base:</label>
            <textarea id="inputText" placeholder="Escribe o pega aquí tu contenido..."></textarea>
            <button onclick="transformarContenido()" id="btnSubmit" class="btn-primary">Transformar Contenido con IA</button>
        </div>

        <div id="loader">⏳ Conectando con Gemini y redactando posts...</div>

        <div id="resultsSection">
            <h3 class="section-title">✨ Contenido Optimizado</h3>
            
            <div class="result-card">
                <span class="badge badge-linkedin">LinkedIn</span>
                <p id="linkedinPost" class="post-text"></p>
                <button onclick="copiarTexto('linkedinPost')" class="btn-secondary">📋 Copiar Post</button>
            </div>

            <div class="result-card">
                <span class="badge badge-twitter">X / Twitter</span>
                <p id="twitterPost" class="post-text"></p>
                <button onclick="copiarTexto('twitterPost')" class="btn-secondary">📋 Copiar Post</button>
            </div>
        </div>
    </main>

    <footer>
        MultiPost AI App &copy; Todos los derechos reservados.
    </footer>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        }

        function guardarKey() {
            const key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('gemini_api_key', key);
        }

        async function transformarContenido() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const textoOriginal = document.getElementById('inputText').value.trim();
            
            if (!apiKey) {
                alert("Por favor, ingresa tu Gemini API Key en el panel rojo superior.");
                return;
            }
            if (!textoOriginal) {
                alert("Por favor, ingresa algún texto para transformar.");
                return;
            }

            const loader = document.getElementById('loader');
            const resultsSection = document.getElementById('resultsSection');
            const btnSubmit = document.getElementById('btnSubmit');

            loader.style.display = 'block';
            resultsSection.style.display = 'none';
            btnSubmit.disabled = true;

            const prompt = "Actúa como un experto en redes sociales. Toma el siguiente texto y genera de forma independiente un post para LinkedIn y un tuit para X/Twitter. Separa obligatoriamente ambas respuestas poniendo únicamente la palabra [SEPARADOR] en una línea en el medio de las dos. Texto base:\n\n" + textoOriginal;

            try {
                const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "Error en los servidores de la API.");
                }

                const respuestaIA = data.candidates[0].content.parts[0].text;
                const partes = respuestaIA.split('[SEPARADOR]');
                
                let postLinkedIn = partes[0] ? partes[0].trim() : 'No se pudo generar el formato para LinkedIn.';
                let postTwitter = partes[1] ? partes[1].trim() : 'No se pudo generar el formato para X/Twitter.';

                document.getElementById('linkedinPost').innerText = postLinkedIn;
                document.getElementById('twitterPost').innerText = postTwitter;

                resultsSection.style.display = 'block';

            } catch (error) {
                alert("Error de la IA: " + error.message);
                console.error(error);
            } finally {
                loader.style.display = 'none';
                btnSubmit.disabled = false;
            }
        }

        function copiarTexto(idElemento) {
            const textToCopy = document.getElementById(idElemento).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("¡Texto copiado al portapapeles con éxito! 🎉");
            }).catch(err => {
                alert("No se pudo copiar automáticamente, por favor selecciónalo manualmente.");
            });
        }
    </script>
</body>
</html>
