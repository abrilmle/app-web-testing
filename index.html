<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Repurposer</title>
    <!-- Cargamos Tailwind CSS mediante una hoja de estilos estándar y directa para máxima compatibilidad -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        /* Agregamos los estilos de fondo y gradientes nativos para asegurar que carguen sin depender de scripts */
        body {
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .bg-gradient-custom {
            background: linear-gradient(to right, #06b6d4, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gradient {
            background: linear-gradient(to right, #06b6d4, #d946ef);
        }
        .bg-card {
            background-color: rgba(30, 41, 59, 0.5);
            border-color: #334155;
        }
        .bg-input {
            background-color: #020617;
            border-color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col justify-between">

    <!-- Navbar / Encabezado -->
    <header class="border-b border-gray-800 p-4 bg-slate-900 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center px-2">
            <h1 class="text-xl font-bold bg-gradient-custom">
                🚀 MultiPost AI
            </h1>
            <span class="text-xs text-gray-400 px-2.5 py-1 rounded-full border border-gray-700 bg-gray-800"> Prototipo v1.1 </span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col justify-center my-4">
        
        <!-- Sección de Entrada -->
        <div class="bg-card p-6 rounded-2xl border shadow-xl mb-6">
            <label class="block text-sm font-medium text-gray-400 mb-2">Pega tu texto largo, artículo o idea base:</label>
            <textarea id="inputText" rows="5" class="w-full bg-input border rounded-xl p-4 text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all" style="resize: none;" placeholder="Escribe o pega aquí el contenido que quieres transformar..."></textarea>
            
            <button onclick="transformarContenido()" class="mt-4 w-full btn-gradient hover:opacity-90 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-lg text-center block">
                Transformar Contenido con IA
            </button>
        </div>

        <!-- Pantalla de Carga (Oculta por defecto) -->
        <div id="loader" class="hidden text-center py-8">
            <p class="text-gray-400 text-sm animate-pulse">⏳ Procesando y adaptando formatos...</p>
        </div>

        <!-- Sección de Resultados (Oculta hasta que haya datos) -->
        <div id="resultsSection" class="hidden space-y-6">
            <h3 class="text-lg font-semibold text-gray-300 px-1">
                ✨ Contenido Optimizado
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tarjeta LinkedIn -->
                <div class="bg-card border rounded-2xl p-5 flex flex-col justify-between mb-4 md:mb-0">
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider text-cyan-400 bg-cyan-900 bg-opacity-20 px-2 py-0.5 rounded">LinkedIn</span>
                        </div>
                        <p id="linkedinPost" class="text-gray-300 text-sm leading-relaxed" style="white-space: pre-line;"></p>
                    </div>
                    <button onclick="copiarTexto('linkedinPost')" class="mt-4 text-xs bg-black border border-gray-800 hover:border-gray-700 text-gray-400 hover:text-gray-200 py-2 px-3 rounded-lg transition-all w-full text-center">
                        📋 Copiar Post
                    </button>
                </div>

                <!-- Tarjeta X (Twitter) -->
                <div class="bg-card border rounded-2xl p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider text-purple-400 bg-purple-900 bg-opacity-20 px-2 py-0.5 rounded">X / Twitter</span>
                        </div>
                        <p id="twitterPost" class="text-gray-300 text-sm leading-relaxed" style="white-space: pre-line;"></p>
                    </div>
                    <button onclick="copiarTexto('twitterPost')" class="mt-4 text-xs bg-black border border-gray-800 hover:border-gray-700 text-gray-400 hover:text-gray-200 py-2 px-3 rounded-lg transition-all w-full text-center">
                        📋 Copiar Post
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-600 border-t border-gray-900 mt-4">
        MultiPost AI App &copy; Todos los derechos reservados.
    </footer>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        function transformarContenido() {
            const textoOriginal = document.getElementById('inputText').value.trim();
            
            if (!textoOriginal) {
                alert("Por favor, ingresa algún texto primero.");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';

            setTimeout(() => {
                const resumenBreve = textoOriginal.split('.').slice(0, 2).join('.') + '.';
                
                const postLinkedIn = `💼 REPURPOSING TIP DE HOY\n\n¿Te cuesta crear contenido constante? No necesitas escribir desde cero todo el tiempo. La clave está en reciclar de forma inteligente.\n\n🎯 Idea principal:\n"${resumenBreve}"\n\n¿Qué opinas de esta estrategia? Te leo en los comentarios 👇\n\n#Productividad #MarketingDigital #CreadoresDeContenido`;
                
                const postTwitter = `🧵 Crear contenido no tiene por qué tomarte todo el día.\n\nAcá te dejo una idea clave para aplicar hoy mismo:\n\n"${resumenBreve.substring(0, 140)}..."\n\n¿Estás de acuerdo? Dejá tu RT o Like 🚀`;

                document.getElementById('linkedinPost').innerText = postLinkedIn;
                document.getElementById('twitterPost').innerText = postTwitter;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'block';
            }, 1200); 
        }

        function copiarTexto(idElemento) {
            const texto = document.getElementById(idElemento).innerText;
            navigator.clipboard.writeText(texto).then(() => {
                alert("¡Texto copiado al portapapeles con éxito! 🎉");
            });
        }
    </script>
</body>
</html>
